name: Build add-ons

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and package
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      source_sha: ${{ steps.version.outputs.source_sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $theme = Get-Content -LiteralPath "src/manifest.json" -Raw | ConvertFrom-Json
          $companion = Get-Content -LiteralPath "companion/manifest.json" -Raw | ConvertFrom-Json
          if ($theme.version -ne $companion.version) {
            throw "Theme version '$($theme.version)' does not match Companion version '$($companion.version)'."
          }
          $version = [string]$theme.version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[.-][0-9A-Za-z.-]+)?$') {
            throw "Unsafe or unsupported package version '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=outlook-style-addons-$version" >> $env:GITHUB_OUTPUT
          "source_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Validate source
        shell: pwsh
        run: |
          ./scripts/validate.ps1
          node --check ./companion/scripts/background.js
          node --check ./companion/scripts/message-display-light.js
          node --check ./companion/api/OutlookThreadView/implementation.js
          git diff --check

      - name: Build XPI and ZIP packages
        shell: pwsh
        run: ./scripts/build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Verify package contents
        shell: pwsh
        run: ./scripts/verify-artifacts.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $artifacts = @(
            "dist/outlook-style-for-thunderbird-$version.xpi"
            "dist/outlook-style-for-thunderbird-$version.zip"
            "dist/outlook-style-companion-$version.xpi"
            "dist/outlook-style-companion-$version.zip"
          )
          $hashLines = Get-FileHash -Algorithm SHA256 -LiteralPath $artifacts |
            Sort-Object Path |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" }
          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD "dist/SHA256SUMS.txt"),
            [string[]]$hashLines,
            [System.Text.UTF8Encoding]::new($false)
          )
          Get-Content -LiteralPath "dist/SHA256SUMS.txt"

      - name: Upload packaged add-ons
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/outlook-style-for-thunderbird-${{ steps.version.outputs.version }}.xpi
            dist/outlook-style-for-thunderbird-${{ steps.version.outputs.version }}.zip
            dist/outlook-style-companion-${{ steps.version.outputs.version }}.xpi
            dist/outlook-style-companion-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish version release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository_id }}-v${{ needs.build.outputs.version }}
      queue: max

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Create or update version release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          ADDON_VERSION: ${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail

          release_exists=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_exists=true
          fi

          tag_target=""
          if tag_target="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha' 2>/dev/null)"; then
            if [[ "$tag_target" != "$TARGET_SHA" ]]; then
              relation="$(gh api "repos/$GH_REPO/compare/$tag_target...$TARGET_SHA" --jq '.status')"
              if [[ "$relation" == "behind" ]]; then
                if [[ "$release_exists" == "true" ]]; then
                  echo "Build $TARGET_SHA is older than published $tag_target; skipping stale release update."
                  exit 0
                fi
                echo "::error::Tag $RELEASE_TAG points to newer commit $tag_target, but no release exists."
                exit 1
              fi
              if [[ "$relation" == "diverged" ]]; then
                main_sha="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
                if [[ "$TARGET_SHA" != "$main_sha" ]]; then
                  echo "Build $TARGET_SHA is not current main $main_sha; skipping diverged stale update."
                  exit 0
                fi
              fi
            fi
          fi

          if [[ "$release_exists" == "true" && -z "$tag_target" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$TARGET_SHA" >/dev/null
            tag_target="$TARGET_SHA"
          fi

          if [[ "$release_exists" == "true" ]]; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
              -f sha="$TARGET_SHA" \
              -F force=true >/dev/null
            echo "Updated $RELEASE_TAG packages and moved its tag to $TARGET_SHA."
            exit 0
          fi

          create_options=(--target "$TARGET_SHA")
          if [[ -n "$tag_target" ]]; then
            if [[ "$tag_target" != "$TARGET_SHA" ]]; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
                -f sha="$TARGET_SHA" \
                -F force=true >/dev/null
            fi
            create_options=(--verify-tag --target "$TARGET_SHA")
          fi

          if ! gh release create "$RELEASE_TAG" release-assets/* \
            --title "Outlook Style for Thunderbird $ADDON_VERSION" \
            --generate-notes \
            "${create_options[@]}"; then
            # Treat a release created concurrently by another successful run as success.
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" release-assets/* --clobber
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
                -f sha="$TARGET_SHA" \
                -F force=true >/dev/null
              echo "Release $RELEASE_TAG was created concurrently and is now updated."
              exit 0
            fi
            exit 1
          fi
